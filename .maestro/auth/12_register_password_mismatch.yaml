appId: com.electraguard.app
name: "AUTH-12 Register with mismatched passwords"
tags: [auth, register, negative]
---
- runFlow: ../subflows/open_register.yaml
- runFlow:
    file: ../subflows/fill_register.yaml
    env:
      R_NAME: "Test User"
      R_ID: "AB12345"
      R_CNIC: "3520212345671"
      R_EMAIL: "qa.user@example.com"
      R_MOBILE: "03001234567"
      R_PASS: "Test@1234"
      R_CONFIRM: "Test@9999"
      R_AGREE: "yes"
- assertVisible: "Passwords do not match."
- takeScreenshot: reports/AUTH-12_register_password_mismatch
- runFlow: ../subflows/dismiss_alert.yaml
