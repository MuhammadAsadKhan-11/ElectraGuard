appId: com.electraguard.app
name: "AUTH-19 Forgot password sends code, wrong code is rejected"
tags: [auth, forgot-password, otp]
---
# Consumer ke email par asli reset code jayega.
- runFlow: ../subflows/launch_fresh.yaml
- tapOn: "Forgot password?"
- extendedWaitUntil:
    visible: "Reset password"
    timeout: 10000
- tapOn: "Email or ID"
- inputText: ${CONSUMER_EMAIL}
- hideKeyboard
- tapOn: "Send code"
- extendedWaitUntil:
    visible: "Code Sent"
    timeout: 30000
- tapOn: "OK"
- extendedWaitUntil:
    visible: "Enter the code"
    timeout: 10000
- assertVisible: "This code expires in 10 minutes."
- inputText: "000000"
# Keyboard band karne ke liye title par tap (hideKeyboard yahan Back dabata hai)
- tapOn: "Enter the code"
- scrollUntilVisible:
    element:
      text: "Verify code"
    direction: DOWN
- tapOn: "Verify code"
- extendedWaitUntil:
    visible: "Invalid Code"
    timeout: 20000
- takeScreenshot: reports/AUTH-19_reset_wrong_otp
- runFlow: ../subflows/dismiss_alert.yaml
