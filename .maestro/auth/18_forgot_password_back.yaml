appId: com.electraguard.app
name: "AUTH-18 Forgot password Back to sign in works"
tags: [auth, forgot-password, navigation]
---
- runFlow: ../subflows/launch_fresh.yaml
- tapOn: "Forgot password?"
- extendedWaitUntil:
    visible: "Reset password"
    timeout: 10000
- assertVisible: "Email or ID"
- tapOn: "Back to sign in"
- extendedWaitUntil:
    visible: "Choose a portal to continue"
    timeout: 10000
