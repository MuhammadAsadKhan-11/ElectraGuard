appId: com.electraguard.app
name: "AUTH-03 Login with wrong password fails"
tags: [auth, negative]
---
- runFlow: ../subflows/launch_fresh.yaml
- tapOn: "Consumer"
- tapOn: "Consumer ID or email"
- inputText: ${CONSUMER_EMAIL}
- tapOn: "Password"
- inputText: "WrongPass@999"
- hideKeyboard
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Login Failed|Error"
    timeout: 20000
- takeScreenshot: reports/AUTH-03_wrong_password
- runFlow: ../subflows/dismiss_alert.yaml
- assertVisible: "Sign in"
