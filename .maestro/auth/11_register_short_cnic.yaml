appId: com.electraguard.app
name: "AUTH-11 Register with short CNIC"
tags: [auth, register, negative]
---
- runFlow: ../subflows/open_register.yaml
- runFlow:
    file: ../subflows/fill_register.yaml
    env:
      R_NAME: "Test User"
      R_ID: "AB12345"
      R_CNIC: "35202"
      R_EMAIL: "qa.user@example.com"
      R_MOBILE: "03001234567"
      R_PASS: "Test@1234"
      R_CONFIRM: "Test@1234"
      R_AGREE: "yes"
- assertVisible: "CNIC number must be exactly 13 digits."
- takeScreenshot: reports/AUTH-11_register_short_cnic
- runFlow: ../subflows/dismiss_alert.yaml
