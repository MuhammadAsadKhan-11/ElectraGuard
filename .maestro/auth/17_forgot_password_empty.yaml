appId: com.electraguard.app
name: "AUTH-17 Forgot password with empty field shows error"
tags: [auth, forgot-password, negative]
---
- runFlow: ../subflows/launch_fresh.yaml
- tapOn: "Forgot password?"
- extendedWaitUntil:
    visible: "Reset password"
    timeout: 10000
- tapOn: "Send code"
- assertVisible: "Please enter your email or ID."
- takeScreenshot: reports/AUTH-17_forgot_empty
- runFlow: ../subflows/dismiss_alert.yaml
