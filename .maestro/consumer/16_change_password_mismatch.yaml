appId: com.electraguard.app
name: "CON-16 Change password with mismatched new passwords"
tags: [consumer, profile, negative]
---
- runFlow: ../subflows/login_consumer.yaml
- tapOn: "Profile"
- extendedWaitUntil:
    visible: "Account"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Change Password"
    direction: DOWN
- tapOn: "Change Password"
- extendedWaitUntil:
    visible: "Enter your old password to continue."
    timeout: 20000
- tapOn: "Old password"
- inputText: ${CONSUMER_PASSWORD}
- tapOn: "New password"
- inputText: "NewPass@123"
- tapOn: "Confirm new password"
- inputText: "NewPass@999"
- hideKeyboard
- tapOn: "Confirm"
- assertVisible: "New passwords do not match."
- takeScreenshot: reports/CON-16_change_pw_mismatch
- runFlow: ../subflows/dismiss_alert.yaml
- tapOn: "Cancel"
