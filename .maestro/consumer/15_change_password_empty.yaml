appId: com.electraguard.app
name: "CON-15 Change password with empty fields shows error"
tags: [consumer, profile, negative]
---
- runFlow: ../subflows/login_consumer.yaml
- tapOn: "Profile"
- extendedWaitUntil:
    visible: "Account"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Change Password"
    direction: DOWN
- tapOn: "Change Password"
- extendedWaitUntil:
    visible: "Enter your old password to continue."
    timeout: 20000
- tapOn: "Confirm"
- assertVisible: "Please fill in all fields."
- takeScreenshot: reports/CON-15_change_pw_empty
- runFlow: ../subflows/dismiss_alert.yaml
- tapOn: "Cancel"
