<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ElectraGuard - Verify Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #F3F4F6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .logo-box {
      background: #0B3C5D;
      width: 72px; height: 72px;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      font-size: 36px;
    }
    h2 { color: #0B3C5D; font-size: 22px; margin-bottom: 4px; }
    .subtitle { color: #6B7280; font-size: 13px; margin-bottom: 28px; }
    .status-icon { font-size: 56px; margin-bottom: 16px; }
    .status-title { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
    .status-msg { color: #6B7280; font-size: 14px; line-height: 1.6; }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0B3C5D;
      border-radius: 50%;
      width: 48px; height: 48px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .success { color: #059669; }
    .error { color: #DC2626; }
    .app-hint {
      margin-top: 24px;
      background: #EFF6FF;
      border-radius: 8px;
      padding: 12px 16px;
      color: #0B3C5D;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-box">⚡</div>
    <h2>ElectraGuard</h2>
    <p class="subtitle">Admin Login Verification</p>

    <div id="content">
      <div class="loader"></div>
      <p class="status-msg">Verifying your account...</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js';
    import { getFirestore, doc, getDoc, updateDoc }
      from 'https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js';

    // ⬇️ Apni Firebase config daalo
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "electraguard-43b18.firebaseapp.com",
      projectId: "electraguard-43b18",
      storageBucket: "electraguard-43b18.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const content = document.getElementById('content');

    const showSuccess = () => {
      content.innerHTML = `
        <div class="status-icon">✅</div>
        <div class="status-title success">Account Verified!</div>
        <p class="status-msg">Your login has been verified successfully.</p>
        <div class="app-hint">
          📱 Go back to the <strong>ElectraGuard app</strong> —
          you will be automatically logged into the dashboard.
        </div>
      `;
    };

    const showError = (msg) => {
      content.innerHTML = `
        <div class="status-icon">❌</div>
        <div class="status-title error">Verification Failed</div>
        <p class="status-msg">${msg}</p>
        <div class="app-hint" style="background:#FEF2F2;color:#DC2626">
          Please go back to the app and try logging in again.
        </div>
      `;
    };

    // Token URL se nikalo
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      showError('Invalid verification link.');
    } else {
      try {
        const tokenRef = doc(db, 'adminVerifyTokens', token);
        const tokenDoc = await getDoc(tokenRef);

        if (!tokenDoc.exists()) {
          showError('Link not found or already used.');
        } else {
          const data = tokenDoc.data();

          if (data.used) {
            showError('This link has already been used.');
          } else if (Date.now() > data.expiresAt) {
            showError('This link has expired. Please login again.');
          } else {
            // Token valid — admin verify karo
            await updateDoc(tokenRef, { used: true });

            // Admins collection mein sessionVerified true karo
            await updateDoc(doc(db, 'admins', data.adminDocId), {
              sessionVerified: true,
              verified: true,
            });

            showSuccess();
          }
        }
      } catch (e) {
        console.error(e);
        showError('Something went wrong. Please try again.');
      }
    }
  </script>
</body>
</html>
